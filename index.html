<!doctype html>
<html lang="es">
    <head>
        <title>STI book</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/styles.css">
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta property="og:title" content="Un Futuro Protegido">
        <meta property="og:description" content="Guía ilustrada sobre las pruebas rápidas para la detección de VIH, hepatitis C y sífilis.">
        <meta property="og:image" content="https://itsbook.netlify.app/images/cristianandangelacover.webp">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://itsbook.netlify.app/">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Un Futuro Protegido">
        <meta name="twitter:description" content="Guía ilustrada sobre las pruebas rápidas para la detección de VIH, hepatitis C y sífilis.">
        <meta name="twitter:image" content="https://itsbook.netlify.app/images/cristianandangelacover.webp">
        <script src="pages.js" defer></script>
        <script src="client.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    </head>

    <body>
        <div class="book-wrapper">

          <button id="lang-toggle" aria-label="Cambiar idioma / Switch language">
            <i class="fas fa-globe"></i>
            <span id="lang-toggle-label">EN</span>
          </button>

          <div id="book" class="book">

            <div class="page-scene">
              <div class="image-frame">
              <img id="page-image" alt="Book illustration">
              </div>
              <div id="cover-overlay" class="cover-overlay">
                <div class="cover-header">
                  <h1 id="cover-title"></h1>
                  <h2 id="cover-subtitle"></h2>
                </div>
                <p id="cover-text"></p>
              </div>

              <div class="page-nav">
                <button id="prev-btn" type="button" class="page-nav-btn" aria-label="Página anterior / Previous page">
                  <i class="fas fa-chevron-left"></i>
                </button>
                <button id="next-btn" type="button" class="page-nav-btn" aria-label="Página siguiente / Next page">
                  <i class="fas fa-chevron-right"></i>
                </button>
              </div>

            <div id="dialog-box" class="dialog-box"></div>

            </div>

            <div id="story-box" class="story-box">
              <h1 id="page-title"></h1>
              <h2 id="page-subtitle"></h2>
              <p id="page-text"></p>
            </div>

          </div>

        </div>
    </body>
</html>
